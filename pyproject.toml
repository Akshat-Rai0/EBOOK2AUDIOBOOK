[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ebook2audiobook"
version = "0.1.0"
description = "Local, offline, agentic ebook-to-audiobook conversion with per-character voices"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Akshat Rai" },
    { name = "Divyanshu Bhusan" },
]
keywords = ["audiobook", "ebook", "tts", "nlp", "agentic-ai"]
dependencies = [
    # Core data modelling
    "pydantic>=2.7",
    # CLI
    "click>=8.1",
    # Web API (M5 scaffold; imported lazily so no startup cost now)
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    # NLP
    "spacy>=3.7",
    # Ebook parsing
    "ebooklib>=0.18",      # AGPL-3.0 — flagged in docs/LICENSES.md; acceptable for open academic use
    "beautifulsoup4>=4.12",# MIT (HTML parsing for EPUB)
    "python-docx>=1.1",    # MIT
    # PDF parsing — permissive alternatives to PyMuPDF (AGPL)
    "pdfplumber>=0.11",    # MIT  (text extraction)
    "pypdf>=4.2",          # BSD-3 (metadata, scan detection)
    # Language identification (bundles its own model; works offline)
    "langdetect>=1.0.9",
    # HTTP client — used by OllamaAttributor to call the local Ollama daemon
    "httpx>=0.27",
    # Audio utilities (wraps FFmpeg)
    "pydub>=0.25",
    # M4B / MP3 tag writing — MIT alternative to mutagen (GPL)
    "mediafile>=0.12",
    # Config file parsing (TOML)
    "tomli>=2.0",
]

[project.scripts]
castbook = "ebook2audiobook.cli.main:cli"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    # Used only in tests to generate synthetic PDFs (no network at runtime)
    "reportlab>=4.2",
    # Config file writing (for tests that modify config)
    "tomli-w>=1.0",
]

[project.optional-dependencies]
tts = [
    "coqui-tts>=0.27.4",   # idiap fork; PyPI name is coqui-tts, not TTS
    "torch",
    "torchaudio",
    # Number-to-words for normaliser
    "num2words>=0.5.12",
    # Coqui compatibility requirements
    "transformers<5.0",    # Coqui requires <5.0 for compatibility
    "torchcodec>=0.17.0",  # Required for PyTorch 2.9+ audio I/O
]

[tool.hatch.build.targets.wheel]
packages = ["ebook2audiobook"]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting (replaces flake8 + black + isort)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = [
    "N999",  # module name may contain hyphens in entrypoints
]

[tool.ruff.lint.isort]
known-first-party = ["ebook2audiobook"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not models'"
markers = [
    "models: Tests that require downloaded model weights (VITS, XTTS, Ollama)",
]
